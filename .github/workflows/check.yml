name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install check and compiler prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 gcc libc6-dev pkg-config libx11-dev libxrandr-dev meson ninja-build libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxft-dev libxrender-dev libxi-dev libxinerama-dev libgif-dev libjpeg-dev libpng-dev
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check source, docs and installer policy
        run: python3 scripts/check-project.py
      - name: Compile the native helpers and physics-free overview
        run: ./scripts/build-helpers.sh /tmp/erdos-helpers
      - name: Stage the live-image configuration
        run: ./build.sh --prepare

  build-alpha2:
    name: Build Alpha 2 ISO and upload draft assets
    if: github.event_name == 'workflow_dispatch' && github.repository == 'patx/erdos'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: erdos-alpha2-draft-assets
      cancel-in-progress: false
    env:
      RELEASE_TAG: v1.0.0-alpha.2
      SOURCE_COMMIT: 97ea861cc1e657f8189131f80dd673304a76cdd1
      DEBIAN_IMAGE: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: automation
      - name: Check out the Alpha 2 source tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v1.0.0-alpha.2
          persist-credentials: false
          path: source
      - name: Verify source and draft destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 automation/scripts/upload-draft-release.py \
            --directory source --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --check-only
      - name: Make room on the disposable hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # These preinstalled SDKs are unused by this Debian/Docker build.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          available=$(df -PB1 "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          test "$available" -ge 21474836480 || { echo 'At least 20 GiB free is required.' >&2; exit 1; }
      - name: Clean Debian 13 live-build and release verification
        run: |
          docker run --rm --privileged \
            --env DEBIAN_FRONTEND=noninteractive \
            --mount "type=bind,source=$GITHUB_WORKSPACE/source,target=/project" \
            --workdir /project "$DEBIAN_IMAGE" bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools wget cpio file apt-utils ca-certificates git python3 gcc libc6-dev pkg-config libx11-dev libxrandr-dev meson ninja-build libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxft-dev libxrender-dev libxi-dev libxinerama-dev libgif-dev libjpeg-dev libpng-dev
              python3 scripts/check-project.py
              ./build.sh
              shopt -s nullglob
              images=(dist/erdos-build-*.iso)
              test "${#images[@]}" -eq 1
              python3 scripts/prepare-release.py --iso "${images[0]}" --date "$(TZ=America/New_York date +%F)"
              cd dist
              sha256sum -c SHA256SUMS
            '
      - name: Record this build and write draft notes
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path
          root = Path('source')
          metadata = json.loads((root / 'docs/release.json').read_text())
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          record = {
              'schema': 1, 'source_tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_commit': os.environ['GITHUB_SHA'], 'workflow_run': run_url,
              'built_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'debian_image': os.environ['DEBIAN_IMAGE'], 'iso': metadata['iso'],
              'boot_install_tested_by_workflow': False,
          }
          path = root / 'dist/erdos-build.json'
          path.write_text(json.dumps(record, indent=2) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with (root / 'dist/SHA256SUMS').open('a') as stream:
              stream.write(f'{digest}  {path.name}\n')
          changes = (root / 'CHANGELOG.md').read_text().split('## 1.0.0-alpha.2', 1)[1].split('\n## ', 1)[0].split('\n', 1)[1].strip()
          notes = f"""ErdOS 1 Alpha 2 — Debian 13/Openbox, amd64.

          ## Changes

          {changes}

          ## Remote build — validation pending

          Source: `{record['source_commit']}`. [Build log]({run_url}).
          ISO: **{metadata['iso']['bytes']:,} bytes**.
          SHA-256: `{metadata['iso']['sha256']}`.

          The image and installer configuration passed the release verifier.
          This workflow does not boot the ISO or test a disk installation.
          The prior local VM tests and footprint measurements identify a different
          ISO; this rebuild needs its own validation before publication.

          Download the ISO with its `.sha256` file and run
          `sha256sum -c erdos-amd64.iso.sha256` before writing it to USB.
          The live account is **user**, password **live**. The offline Debian text
          installer is a separate boot-menu entry. Disk selection and final write
          confirmation remain manual. Back up disks; this is an experimental
          prerelease without Secure Boot support.

          `erdos-build.json` records the source, workflow and actual ISO identity.
          This release stays a draft until the rebuilt image is tested.
          """
          notes = notes.strip() + '\n'
          Path(os.environ['RUNNER_TEMP'], 'erdos-release-notes.md').write_text(notes)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(f"## Alpha 2 remote build\n\nSource: `{record['source_commit']}`\n\nISO SHA-256: `{metadata['iso']['sha256']}`\n\nFresh boot/install validation is still required.\n")
          PY
      - name: Upload to draft prerelease and verify server hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/scripts/upload-draft-release.py \
            --directory source --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --notes "$RUNNER_TEMP/erdos-release-notes.md"
