# Trigger once during a deliberate swipe, without waiting for finger release.
[swipe]
# Distance is in libinput-normalized gesture units (1000 dpi).
distance = 120
direction_ratio = 1.5

[bindings]
3_up = overview-show
3_down = overview-hide
3_left = window-previous
3_right = window-next
4_left = workspace-next
4_right = workspace-previous
