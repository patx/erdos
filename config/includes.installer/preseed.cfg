# Install this image's Openbox filesystem using the official Debian Installer.
# Disk selection, partitioning, usernames, passwords and write confirmations stay interactive.
# Use the first account for administration with its own password. Debian's
# user-setup otherwise omits sudo membership when a root password is chosen.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
# Install entirely from the USB. Configure Wi-Fi in the installed desktop.
# Skip the separate driver fallback as well as network configuration.
d-i ethdetect/module_select select no ethernet card
d-i ethdetect/prompt_missing_firmware boolean false
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string erdos
d-i netcfg/get_domain string
# Do not wait for an Internet time server during offline installation.
d-i clock-setup/ntp boolean false
# Automatically load required firmware when it is available on the image.
d-i hw-detect/load_firmware boolean true
d-i live-installer/enable boolean true
# Keep the desktop already supplied by the live image.
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
# Do not contact or validate a mirror during installation. The finish hook
# installs online APT sources after Debian has cleaned up its CD sources.
d-i anna/choose_modules string apt-mirror-setup
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
# Disable CD entries only at finish-install, after bootloader packages are installed.
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/enable-source-repositories boolean false
# Install GRUB normally. Keep its BIOS target-device choice interactive: the
# first disk can be the USB installer, so never assume /dev/sda or "default".
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# Deliberately do not preseed any partman disk, method, recipe, erase, RAID/LVM
# removal or write-confirmation values. Every disk choice stays with the user.
