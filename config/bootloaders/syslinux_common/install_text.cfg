label installstart
	menu label ^Install ErdOS
	linux @KERNEL_DI@
	initrd @INITRD_DI@
	append vga=788 @APPEND_INSTALL@ --- quiet

menu begin install
	menu label ^Install options
	menu title Install options
	include stdmenu.cfg
	label mainmenu
		menu label ^Back
		menu exit

	menu begin textinstall
		menu label ^Text installer
		menu title Text installer
		include stdmenu.cfg
		label mainmenu
			menu label ^Back
			menu exit

		label install
			menu label ^Install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append vga=788 @APPEND_INSTALL@ --- quiet

		label expert
			menu label E^xpert install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append priority=low vga=788 @APPEND_INSTALL@

		label auto
			menu label ^Auto install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append auto=true priority=critical vga=788 @APPEND_INSTALL@ --- quiet

		label rescue
			menu label ^Rescue
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet
	menu end

	menu begin textinstalldark
		menu label Dar^k text installer
		menu title Dark text installer
		include stdmenu.cfg
		label mainmenu
			menu label ^Back
			menu exit

		label darkinstall
			menu label ^Install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append vga=788 theme=dark @APPEND_INSTALL@ --- quiet

		label darkexpert
			menu label E^xpert install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append priority=low vga=788 theme=dark @APPEND_INSTALL@

		label darkauto
			menu label ^Auto install
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append auto=true priority=critical vga=788 theme=dark @APPEND_INSTALL@ --- quiet

		label darkrescue
			menu label ^Rescue
			linux @KERNEL_DI@
			initrd @INITRD_DI@
			append rescue/enable=true vga=788 theme=dark @APPEND_INSTALL@ --- quiet
	menu end
menu end
